name: Aggiorna le recensioni

# Ogni lunedì controlla la scheda Posarelli e aggiorna il sito da solo.
#
# Le recensioni NUOVE da 5 stelle vengono pubblicate senza chiedere niente:
# oggi lo sono tutte e 61, e far approvare a mano una cosa che si approva
# sempre non è controllo, è un promemoria che prima o poi si ignora.
#
# Tutto ciò che sta SOTTO le 5 stelle si ferma e apre un avviso. Questa è la
# vetrina della casa, non un aggregatore: una recensione tiepida deve poterla
# leggere una persona prima che finisca in pagina.
#
# Le decisioni già prese non si toccano mai: una recensione revocata a mano
# resta revocata anche quando l'automazione ripassa.

on:
  schedule:
    - cron: '17 6 * * 1'      # ogni lunedì alle 06:17 UTC
  workflow_dispatch:           # e quando vuoi, dal tab Actions

permissions:
  contents: write
  issues: write

concurrency:
  group: recensioni
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      # Se esiste il segreto PAT_RECENSIONI i commit risultano fatti da te e
      # l'attività sul repo conta di sicuro per il timer dei 60 giorni. Se non
      # esiste si usa il token predefinito e funziona comunque: il segreto è
      # un rinforzo, non un requisito.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_RECENSIONI || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # servono solo node-html-parser e sharp: lighthouse e puppeteer no
      - run: npm ci --omit=dev

      - name: Guarda cosa cambierebbe
        run: node scripts/fetch-reviews.mjs --auto-approve --dry-run | tee dry-run.txt

      - name: Aggiorna il JSON
        run: node scripts/fetch-reviews.mjs --auto-approve

      - name: Riscrivi index.html
        run: node scripts/build-site.mjs

      - name: Cosa è successo?
        id: esito
        run: |
          if git diff --quiet -- data/reviews.json index.html; then
            echo "cambiato=no" >> "$GITHUB_OUTPUT"
            echo "da_guardare=0" >> "$GITHUB_OUTPUT"
            echo "Nessuna novità sulla scheda."
            exit 0
          fi
          echo "cambiato=si" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const now  = JSON.parse(fs.readFileSync("data/reviews.json", "utf8"));
            const prev = JSON.parse(require("child_process")
              .execSync("git show HEAD:data/reviews.json").toString());
            const old  = new Set(prev.reviews.map(r => r.id));
            const nuove = now.reviews.filter(r => !old.has(r.id));
            const pubblicate = nuove.filter(r => r.approved === true);
            const ferme      = nuove.filter(r => r.approved !== true);

            const riga = r =>
              "- **" + r.author + "**" + (r.from ? " · " + r.from : "") +
              " · " + r.rating + "/5 · " + (r.lang || "??") +
              (r.date ? " · " + r.date : "") +
              "\n  `" + r.id + "`\n\n  > " + r.text.replace(/\n/g, " ") + "\n";

            fs.writeFileSync("ferme.md", ferme.map(riga).join("\n"));
            fs.writeFileSync("pubblicate.md", pubblicate.map(riga).join("\n"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              "da_guardare=" + ferme.length + "\n" +
              "pubblicate="  + pubblicate.length + "\n");
            console.log("pubblicate da sole:", pubblicate.length, "| da guardare:", ferme.length);
          '

      - name: Salva e pubblica
        if: steps.esito.outputs.cambiato == 'si'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json index.html
          git commit -m "Recensioni: ${{ steps.esito.outputs.pubblicate }} pubblicate, ${{ steps.esito.outputs.da_guardare }} da guardare

          Aggiornamento automatico dalla scheda Posarelli. Le recensioni da 5
          stelle vanno online da sole; sotto le 5 stelle restano ferme e viene
          aperto un avviso."
          git push

      # Avvisa SOLO se c'è davvero qualcosa da decidere. Un avviso che arriva
      # anche quando è tutto a posto smette di essere letto.
      - name: Avvisa se c'è da decidere
        if: steps.esito.outputs.da_guardare != '0' && steps.esito.outputs.da_guardare != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ferme = fs.existsSync('ferme.md') ? fs.readFileSync('ferme.md', 'utf8') : '';
            const dry = fs.existsSync('dry-run.txt') ? fs.readFileSync('dry-run.txt', 'utf8') : '';
            const oggi = new Date().toISOString().slice(0, 10);
            const n = '${{ steps.esito.outputs.da_guardare }}';
            const body = [
              `Sono arrivate **${n} recensioni sotto le 5 stelle**. Non sono online:`,
              'si fermano qui apposta, perché le legga una persona.',
              '',
              ferme,
              '',
              '### Se vuoi pubblicarle',
              '',
              '```bash',
              'git pull',
              'npm run approve -- <id> <id>',
              'npm run build && git push',
              '```',
              '',
              'Se invece preferisci lasciarle fuori, non serve fare niente:',
              'restano nel file e non compaiono.',
              '',
              '<details><summary>Report completo</summary>',
              '',
              '```',
              dry.trim(),
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${n} recensioni da guardare — ${oggi}`,
              body,
              labels: ['recensioni'],
            });

      # GitHub spegne le azioni pianificate dopo 60 giorni senza attività sul
      # repo. D'inverno le recensioni possono non arrivare per mesi: senza un
      # commit l'automazione si spegnerebbe proprio nel periodo in cui non la
      # si guarda. Oltre i 40 giorni fermi, un commit di servizio.
      - name: Battito, se il repo è fermo da troppo
        if: steps.esito.outputs.cambiato == 'no'
        run: |
          ULTIMO=$(git log -1 --format=%ct)
          GIORNI=$(( ( $(date +%s) - ULTIMO ) / 86400 ))
          echo "ultimo commit: $GIORNI giorni fa"
          if [ "$GIORNI" -ge 40 ]; then
            mkdir -p data
            {
              echo "Ultimo controllo delle recensioni senza novità."
              echo "Commit di servizio: GitHub spegne le azioni programmate dopo"
              echo "60 giorni di inattività del repo."
              echo
              date -u '+%Y-%m-%d %H:%M UTC'
            } > data/ULTIMO-CONTROLLO.txt
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ULTIMO-CONTROLLO.txt
            git commit -m "Battito: nessuna novità nelle recensioni"
            git push
          else
            echo "Niente battito: il repo si è mosso da poco."
          fi
